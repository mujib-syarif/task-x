name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Izin seminimal mungkin. Hanya job release yang diberi izin tulis.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate missing Android scaffold
        # Repo hanya menyimpan kode Task X (manifest, Kotlin, ikon). Berkas Gradle bawaan
        # dibuat oleh versi Flutter yang sedang dipakai; berkas yang sudah ada TIDAK ditimpa.
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          flutter create --platforms=android --org com.mujibsyarif --project-name task_x "$tmp/scaffold" >/dev/null
          mkdir -p android
          cp -rn "$tmp/scaffold/android/." android/
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          echo "applicationId:"
          grep -rn "applicationId" android/app/build.gradle* || true


      - name: Define log helper
        run: |
          cat > "$RUNNER_TEMP/ann.sh" <<'SH'
          # usage: ann.sh <title> <command...>  -> menjalankan perintah; jika gagal, kirim output sebagai annotation
          title="$1"; shift
          set +e
          "$@" 2>&1 | tee "$RUNNER_TEMP/out.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg="$(tail -c 12000 "$RUNNER_TEMP/out.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=$title::$msg"
          fi
          exit $code
          SH
          chmod +x "$RUNNER_TEMP/ann.sh"

      - name: Pub get
        run: $RUNNER_TEMP/ann.sh pub flutter pub get

      - name: Analyze
        run: $RUNNER_TEMP/ann.sh analyze flutter analyze

      - name: Test
        run: $RUNNER_TEMP/ann.sh test flutter test

      - name: Build release APK
        run: $RUNNER_TEMP/ann.sh build flutter build apk --release

      - name: Verify APK
        id: apk
        run: |
          set -uo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk" || { echo "::error title=verify::APK tidak dihasilkan"; exit 1; }
          mkdir -p dist
          ver="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          out="dist/TaskX-v${ver}-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"
          unzip -l "$out" > "$RUNNER_TEMP/apk_list.txt"
          fail=0
          grep -q "flutter_assets/assets/images/mujib_logo.png" "$RUNNER_TEMP/apk_list.txt" \
            || { echo "Logo tidak ada di APK"; fail=1; }
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          info="no-aapt2"
          if [ -n "$aapt2" ]; then
            info="$("$aapt2" dump badging "$out" 2>&1 | grep -E "^(package|application-label|application-icon|launchable)" | head -12)"
            echo "$info"
            echo "$info" | grep -q "application-icon" || { echo "Ikon launcher tidak ditemukan"; fail=1; }
          fi
          msg="$(printf '%s\n' "size=$(stat -c %s "$out")" "$info" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          if [ "$fail" -ne 0 ]; then
            echo "::error title=verify::FAILED%0A$msg%0A$(grep -E 'logo|launcher' "$RUNNER_TEMP/apk_list.txt" | head -15 | sed 's/%/%25/g' | paste -sd'|')"
            exit 1
          fi
          echo "::notice title=verify::OK%0A$msg"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskX-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TaskX-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Task X ${{ github.ref_name }}" \
            --notes "Task X by mujib_syarif — APK release (ditandatangani kunci debug; instal manual)."
